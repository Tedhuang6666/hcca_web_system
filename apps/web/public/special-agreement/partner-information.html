<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>特約洽談資訊摘要</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #243447; background: #fffdf8; }
      body { margin: 0; padding: 28px; line-height: 1.75; }
      main { max-width: 760px; margin: 0 auto; }
      h1 { margin: 0; color: #173654; font-size: 1.55rem; line-height: 1.35; }
      h2 { margin: 28px 0 8px; color: #173654; font-size: 1.05rem; }
      p { margin: 8px 0; }
      ul, ol { margin: 8px 0; padding-left: 1.5rem; }
      .note { margin-top: 22px; padding: 14px 16px; border: 1px solid #d9e0e5; border-radius: 10px; background: #f1f5f7; }
      @media (max-width: 560px) { body { padding: 20px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>特約洽談資訊摘要</h1>
      <p>這份文件提供合作單位快速掌握特約洽談的準備方向與確認項目。</p>
      <h2>洽談流程</h2>
      <ol>
        <li>提出合作構想與基本聯絡資訊</li>
        <li>確認合作範圍、期間與適用對象</li>
        <li>雙方確認公開文字與執行方式</li>
        <li>發布特約資訊並維持後續更新</li>
      </ol>
      <h2>建議準備內容</h2>
      <ul>
        <li>合作單位、聯絡窗口與可回覆時段</li>
        <li>優惠或服務的具體內容與使用限制</li>
        <li>合作期間、適用對象與兌換方式</li>
        <li>可提供的圖片、標誌或宣傳素材</li>
      </ul>
      <p class="note">方案或聯絡資訊異動時，請儘早通知班聯會，以便同步更新公開頁內容。</p>
    </main>
  </body>
</html>
