name: Security regression and active public probes

on:
  schedule:
    - cron: "41 21 * * *" # 每日台北 05:41：DNS、輸入與認證邊界
    - cron: "11 22 * * 0" # 每週日台北 06:11：HTTP 存取控制基線
    - cron: "51 22 * * 0" # 每週日台北 06:51：固定路徑枚舉
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 公開站主動測試類型
        type: choice
        options:
          - daily
          - http-baseline
          - path-enumeration
        default: daily
        required: true
  pull_request:
    paths:
      - "apps/api/**"
      - "libs/shared/**"
      - "scripts/security-*.py"
      - "scripts/tests/test_security_*.py"
      - "security/**"
      - "scripts/systemd/user/**"
      - "scripts/install-security-timers.sh"
      - "docs/SECURITY_TESTING.md"
      - ".github/workflows/security-regression.yml"

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regressions:
    if: github.event_name != 'schedule' || github.event.schedule == '41 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hcca_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@127.0.0.1:5432/hcca_security_test
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:password@127.0.0.1:5432/hcca_security_test
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      REDIS_REALTIME_URL: redis://127.0.0.1:6379/2
      CELERY_BROKER_URL: redis://127.0.0.1:6379/3
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/4
      SECRET_KEY: ci-security-${{ github.run_id }}
      ENVIRONMENT: testing
      SENTRY_DSN: ""
      POSTHOG_API_KEY: ""
      OTEL_ENABLED: "false"
      WS_PUBSUB_BACKEND: memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install 3.12
      - name: Verify scanner boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_security_*.py'
      - name: Authentication, authorization and exploit regression tests
        run: |
          bash scripts/check.sh api-test \
            apps/api/tests/test_auth_flows.py \
            apps/api/tests/test_auth_policy.py \
            apps/api/tests/test_optional_auth_blocks.py \
            apps/api/tests/test_search_input_security.py \
            apps/api/tests/test_admin_system_defense.py \
            apps/api/tests/test_security.py \
            apps/api/tests/test_security_hardening.py \
            apps/api/tests/test_waf.py \
            apps/api/tests/test_config_security.py \
            apps/api/tests/test_rbac.py \
            apps/api/tests/test_idor.py \
            apps/api/tests/test_permission_matrix.py \
            apps/api/tests/test_api_keys.py \
            apps/api/tests/test_mfa_router.py \
            apps/api/tests/test_mfa_service.py \
            apps/api/tests/test_metrics_tasks.py \
            apps/api/tests/test_documents_router.py \
            apps/api/tests/test_documents_attachments_router.py \
            apps/api/tests/test_regulations_router.py \
            apps/api/tests/test_regulation_service.py \
            apps/api/tests/test_finance_router.py \
            apps/api/tests/test_receivables_router.py \
            apps/api/tests/test_announcements.py \
            apps/api/tests/test_survey_router.py \
            apps/api/tests/test_shop_router.py \
            --junitxml=security-reports/regressions.xml
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install checksum-pinned ZAP
        run: |
          curl --fail --silent --show-error --location --max-time 180 \
            https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Crossplatform.zip \
            --output "$RUNNER_TEMP/zap.zip"
          echo "94c8f767b1c2e94f0db66b3ae56514d5e3f5a728ee1b6c798e0c8fe2d61fbff0  $RUNNER_TEMP/zap.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/zap.zip" -d "$RUNNER_TEMP/zap"
          chmod +x "$RUNNER_TEMP/zap/ZAP_2.17.0/zap.sh"
      - name: Isolated API migration and ZAP active regression
        env:
          REDIS_URL: redis://127.0.0.1:6379/10
        run: |
          uv run --locked --project apps/api python scripts/security-zap.py \
            --zap "$RUNNER_TEMP/zap/ZAP_2.17.0/zap.sh" \
            --output security-reports/zap.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-regressions
          path: security-reports/
          retention-days: 14

  production-active-probes:
    # 每日只送 4 個輸入探針與 2 個認證邊界探針，避免集中觸發 WAF 門檻。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && ((github.event_name == 'schedule' && github.event.schedule == '41 21 * * *') || (github.event_name == 'workflow_dispatch' && inputs.scan_mode == 'daily'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fixed active DNS candidate discovery
        if: always()
        run: python3 scripts/security-dns.py --output security-reports/dns.json
      - name: Four rate-limited SQL injection and XSS probes
        if: always()
        run: python3 scripts/security-active.py --output security-reports/active.json
      - name: Install checksum-pinned nuclei
        id: install_nuclei
        if: always()
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/projectdiscovery/nuclei/releases/download/v3.8.0/nuclei_3.8.0_linux_amd64.zip \
            --output "$RUNNER_TEMP/nuclei.zip"
          echo "cd4ea43c88b50af8ab96eb6ad3fb4debd8e9d51efaff4d4c2d99106041578943  $RUNNER_TEMP/nuclei.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/nuclei.zip" nuclei -d "$RUNNER_TEMP/nuclei-bin"
          echo "$RUNNER_TEMP/nuclei-bin" >> "$GITHUB_PATH"
      - name: Two reviewed active authentication-boundary probes
        if: always() && steps.install_nuclei.outcome == 'success'
        run: python3 scripts/security-nuclei.py --output security-reports/nuclei.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-daily-active-probes
          path: security-reports/
          retention-days: 14

  production-http-baseline:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && ((github.event_name == 'schedule' && github.event.schedule == '11 22 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scan_mode == 'http-baseline'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nine fixed HTTP access and header controls, one request per 45 seconds
        run: python3 scripts/security-baseline.py --interval 45 --output security-reports/http-controls.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-weekly-http-baseline
          path: security-reports/
          retention-days: 14

  production-path-enumeration:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && ((github.event_name == 'schedule' && github.event.schedule == '51 22 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scan_mode == 'path-enumeration'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Twelve fixed HEAD path probes, one request per 45 seconds
        run: python3 scripts/security-paths.py --interval 45 --output security-reports/paths.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-weekly-path-enumeration
          path: security-reports/
          retention-days: 14
