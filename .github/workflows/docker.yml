name: Build Docker Images

# 只為通過 CI 的 main commit 建置正式映像；部署腳本以 :<sha> 拉取，
# 因此 CI 失敗的 commit 不會透過這個工作流程發布映像。
on:
  workflow_run:
    workflows: ["CI — Lint, Types & Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    # workflow_run 會在 PR 完成時同樣觸發；只接受本 repo 對 main 的 push，且 CI 必須成功。
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            image: ghcr.io/tedhuang6666/hcca_web_system-api
          - name: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/tedhuang6666/hcca_web_system-web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # 固定使用 CI 驗證過的 commit；不能在 runner 排隊期間改抓新版 main。
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver: docker-container

      - name: 產生建置版本資訊
        id: version
        run: |
          version_base="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version_base" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "VERSION 必須為 XX.XX.XX.XX，例如 01.00.00.00" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          app_version="${version_base}.$(printf '%02d' "$(git rev-list --count "$commit")")"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "ref=main" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ steps.version.outputs.commit }}
            ${{ matrix.image }}:${{ steps.version.outputs.app_version }}
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_WS_URL=
            NEXT_PUBLIC_SHOP_LOOKBOOK_BASE_URL=${{ vars.NEXT_PUBLIC_SHOP_LOOKBOOK_BASE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || '0.05' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
            BUILD_COMMIT=${{ steps.version.outputs.commit }}
            BUILD_REF=${{ steps.version.outputs.ref }}
            BUILD_TIME=${{ steps.version.outputs.built_at }}
            NEXT_PUBLIC_BUILD_COMMIT=${{ steps.version.outputs.commit }}
            NEXT_PUBLIC_BUILD_REF=${{ steps.version.outputs.ref }}
            NEXT_PUBLIC_BUILD_TIME=${{ steps.version.outputs.built_at }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
