<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>系統維護中｜校園自治整合平台</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf8f3;
        --surface: #fffef9;
        --ink: #1a1a2e;
        --muted: #475569;
        --quiet: #5f6b7e;
        --line: #e8e2d6;
        --line-strong: #d5cfc4;
        --gold: #c9a84c;
        --gold-deep: #856518;
        --gold-dim: #faf4e4;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1117;
          --surface: #1a1d27;
          --ink: #e8e6f0;
          --muted: #b8b5c5;
          --quiet: #aaa8ba;
          --line: #2a2d3e;
          --line-strong: #3d425d;
          --gold: #d4b45e;
          --gold-deep: #d4b45e;
          --gold-dim: rgba(201, 168, 76, 0.12);
        }
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        border-top: 2px solid var(--gold);
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Noto Sans TC", sans-serif;
        line-height: 1.6;
      }

      ::selection {
        background: color-mix(in srgb, var(--gold) 24%, transparent);
      }

      .page-shell {
        width: min(100% - 40px, 1160px);
        min-height: calc(100vh - 2px);
        margin: 0 auto;
        padding: 28px 0 22px;
        display: flex;
        flex-direction: column;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      header {
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--gold);
        border-radius: 50%;
        color: var(--gold-deep);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.2rem;
        font-weight: 700;
      }

      .brand-name,
      .brand-subtitle {
        display: block;
      }

      .brand-name {
        color: var(--ink);
        font-size: 0.9rem;
        font-weight: 750;
        letter-spacing: 0.02em;
      }

      .brand-subtitle {
        margin-top: 2px;
        color: var(--quiet);
        font-size: 0.72rem;
      }

      .header-label {
        color: var(--quiet);
        font-size: 0.68rem;
        font-weight: 650;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.72fr);
        align-items: center;
        gap: clamp(48px, 9vw, 120px);
        padding: clamp(56px, 10vh, 112px) 0;
      }

      .status-line {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 24px;
        color: var(--gold-deep);
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.08em;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 0 5px var(--gold-dim);
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        color: var(--ink);
        font-size: clamp(3rem, 7vw, 5.75rem);
        font-weight: 650;
        letter-spacing: -0.045em;
        line-height: 1.05;
        text-wrap: balance;
      }

      .lead {
        max-width: 560px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 1.7vw, 1.12rem);
        line-height: 1.85;
        text-wrap: pretty;
      }

      .status-panel {
        max-width: 620px;
        margin-top: 36px;
        padding: 18px 0 0;
        border-top: 1px solid var(--gold);
      }

      .status-panel strong,
      .status-panel span {
        display: block;
      }

      .status-panel strong {
        color: var(--ink);
        font-size: 0.95rem;
      }

      .status-panel span {
        margin-top: 4px;
        color: var(--gold-deep);
        font-size: 0.72rem;
        font-weight: 650;
        letter-spacing: 0.12em;
      }

      .status-panel p {
        margin: 12px 0 0;
        color: var(--quiet);
        font-size: 0.88rem;
      }

      aside {
        padding: 24px 0 24px 28px;
        border-left: 1px solid var(--line-strong);
      }

      .aside-label {
        margin: 0;
        color: var(--gold-deep);
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      aside h2 {
        max-width: 330px;
        margin: 15px 0 14px;
        color: var(--ink);
        font-size: clamp(1.45rem, 2.8vw, 2rem);
        font-weight: 650;
        letter-spacing: -0.025em;
        line-height: 1.35;
        text-wrap: balance;
      }

      aside > p:not(.aside-label) {
        max-width: 360px;
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.8;
      }

      .deployment-status {
        display: grid;
        gap: 0;
        max-width: 360px;
        margin: 28px 0 0;
        border-top: 1px solid var(--line);
      }

      .deployment-status div {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }

      .deployment-status dt,
      .deployment-status dd {
        margin: 0;
        font-size: 0.82rem;
      }

      .deployment-status dt { color: var(--quiet); }

      .deployment-status dd {
        color: var(--ink);
        font-weight: 650;
        text-align: right;
      }

      .deployment-status dd::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 7px 1px 0;
        border-radius: 50%;
        background: var(--gold);
      }

      footer {
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--quiet);
        font-size: 0.72rem;
      }

      footer span { color: var(--gold-deep); }

      @media (max-width: 720px) {
        .page-shell {
          width: min(100% - 32px, 560px);
          padding-top: 22px;
        }

        .header-label { display: none; }

        main {
          display: block;
          padding: 68px 0 56px;
        }

        h1 { font-size: clamp(3rem, 15vw, 4.6rem); }

        aside {
          margin-top: 56px;
          padding: 24px 0 0;
          border-top: 1px solid var(--line-strong);
          border-left: 0;
        }

        footer {
          align-items: flex-start;
          gap: 8px 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header>
        <div class="brand" aria-label="校園自治整合平台">
          <span class="brand-mark" aria-hidden="true">H</span>
          <span>
            <span class="brand-name">新竹高中班聯會</span>
            <span class="brand-subtitle">HCCA · 校園自治整合平台</span>
          </span>
        </div>
        <span class="header-label">System status</span>
      </header>

      <main>
        <section aria-labelledby="maintenance-title" aria-live="polite">
          <p class="status-line"><span class="status-dot" aria-hidden="true"></span>系統維護中</p>
          <h1 id="maintenance-title">系統維護中</h1>
          <p class="lead">平台正在進行版本更新。完成後服務會自動恢復，請稍後再回來。</p>
          <div class="status-panel" role="status">
            <strong>目前暫停一般服務</strong>
            <span>MAINTENANCE IN PROGRESS</span>
            <p>資料與已完成的作業都受到保護，不會因本次維護遺失。</p>
          </div>
        </section>

        <aside aria-label="部署狀態">
          <p class="aside-label">Deployment status</p>
          <h2>平台正在完成版本更新。</h2>
          <p>我們正在整理必要的系統服務，讓下一次使用更加穩定。服務恢復後將自動返回。</p>
          <dl class="deployment-status">
            <div>
              <dt>目前階段</dt>
              <dd>部署維護中</dd>
            </div>
            <div>
              <dt>一般服務</dt>
              <dd>暫時停止</dd>
            </div>
            <div>
              <dt>資料狀態</dt>
              <dd>受到保護</dd>
            </div>
          </dl>
        </aside>
      </main>

      <footer>
        <span>校園自治整合平台</span>
        <span>HCCA · Campus Self-Governance</span>
      </footer>
    </div>
  </body>
</html>
