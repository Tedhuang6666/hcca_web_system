# Local API test dependencies only. Never shares the development/production volumes.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hcca_test
      POSTGRES_PASSWORD: hcca_test
      POSTGRES_DB: campus_platform_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcca_test -d campus_platform_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  test-postgres-data:
